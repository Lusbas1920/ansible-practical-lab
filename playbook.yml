---
- name: Laboratorio practico de Ansible
  hosts: docker
  gather_facts: yes

  tasks:
    - name: Mostrar hostname del servidor
      ansible.builtin.debug:
        msg: "Servidor: {{ ansible_hostname }}"

    - name: Mostrar sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_distribution }}"

    - name: Crear directorio principal
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: '0755'

    - name: Crear archivo info.txt
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Nombre del servidor: {{ ansible_hostname }}
          Sistema operativo: {{ ansible_distribution }}
        mode: '0644'

    - name: Crear carpetas mediante un bucle
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - logs
        - backup
        - config

    - name: Mensaje para servidores Ubuntu
      ansible.builtin.debug:
        msg: "Este servidor utiliza Ubuntu"
      when: ansible_distribution == "Ubuntu"
